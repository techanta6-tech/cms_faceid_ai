server {
    listen 80;
    server_name _;

    # Cấu hình log
    access_log /var/log/nginx/cms_faceid_access.log;
    error_log /var/log/nginx/cms_faceid_error.log;

    # Proxy các request API đến Backend NestJS
    location / {
        # 1. Xử lý Preflight request (OPTIONS) từ trình duyệt
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Token,LCMSServerId' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # 2. Để NestJS (chạy app.enableCors()) tự trả header CORS cho các request GET, POST...
        # KHÔNG add_header ở đây nữa để tránh bị trùng lặp header với NestJS!

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
